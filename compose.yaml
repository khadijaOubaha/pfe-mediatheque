services:
  database:
    image: mysql:8.0
    container_name: mediatheque_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediatheque
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: mediatheque_adminer
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  db_data:
