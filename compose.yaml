services:
  database:
    image: mysql:8.0
    container_name: mediatheque_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mediatheque
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: mediatheque_app
    environment:
      APP_ENV: dev
      APP_SECRET: secret-de-developpement
      DATABASE_URL: "mysql://app:app@database:3306/mediatheque?serverVersion=8.0&charset=utf8mb4"
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy

  adminer:
    image: adminer
    container_name: mediatheque_adminer
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  db_data:
