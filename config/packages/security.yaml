security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_ADMIN: ROLE_BIBLIOTHECAIRE

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_apres_connexion
                always_use_default_target_path: true
            logout:
                path: app_logout

    access_control:
        - { path: ^/admin, roles: ROLE_BIBLIOTHECAIRE }
        - { path: ^/statistiques, roles: ROLE_BIBLIOTHECAIRE }
        - { path: ^/mon-espace, roles: ROLE_ADHERENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
